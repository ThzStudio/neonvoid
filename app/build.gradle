plugins { id 'com.android.application' }

def ksProps = new Properties()
def ksFile = rootProject.file('keystore.properties')
if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }
def ks = { String k, String envName -> ksProps.getProperty(k) ?: System.getenv(envName) }
def ksPath = ks('storeFile', 'KEYSTORE_FILE')
def vCode = Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')

android {
    namespace 'com.thzstudio.neonvoid'
    compileSdk 36
    defaultConfig {
        applicationId 'com.thzstudio.neonvoid'
        minSdk 23
        targetSdk 36
        versionCode vCode
        versionName "1." + vCode
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets { main { assets.srcDirs = ['../docs'] } }
    signingConfigs {
        release {
            if (ksPath) {
                storeFile file(ksPath)
                storePassword ks('storePassword', 'KEYSTORE_PASSWORD')
                keyAlias ks('keyAlias', 'KEY_ALIAS')
                keyPassword ks('keyPassword', 'KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (ksPath) signingConfig signingConfigs.release
        }
    }
}
