<script>
/* =====================================================================
   NEON VOID — LOGIN / CADASTRO + SAVE NA NUVEM (PlayFab)
   - Ao abrir o jogo, o jogador precisa entrar com Nome + Senha.
   - Primeiro acesso: aba "Criar conta". Depois: aba "Entrar".
   - A conta fica no PlayFab, então sobrevive a desinstalar/reinstalar.
   - O progresso do jogo (moedas, naves, recorde) é enviado ao PlayFab
     automaticamente e restaurado ao entrar em qualquer aparelho.
   - A senha NUNCA é guardada no aparelho (só o PlayFab a valida).
   ===================================================================== */
(() => {
'use strict';

const TITLE_ID = '1CB57E';                                  // Title ID do PlayFab
const API = 'https://' + TITLE_ID.toLowerCase() + '.playfabapi.com';
const KEYS = ['neonvoid3', 'neonvoid2', 'nv_story_v1', 'nv_story_campaign_progress_v1', 'nv_multiverse_state_v1'];                    // chaves do jogo que vão pra nuvem
const STAT = 'HighScore';                                   // nome da estatística do ranking no PlayFab

const rawSet = Storage.prototype.setItem;                   // originais (para o jogo não nos atrapalhar)
const rawGet = Storage.prototype.getItem;
const rawDel = Storage.prototype.removeItem;
const SS = window.localStorage; // mantém a sessão após fechar e reabrir o jogo
const ss = {
  get: k => { try { return SS.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { SS.setItem(k, v); } catch (e) {} },
  del: k => { try { SS.removeItem(k); } catch (e) {} },
};

let ticket = ss.get('nv_ticket');                           // sessão persistente até expirar ou sair
const offline = ss.get('nv_off') === '1';

/* ---------- chamada REST ao PlayFab ---------- */
function post(path, body, tk, keep) {
  const headers = { 'Content-Type': 'application/json' };
  if (tk) headers['X-Authorization'] = tk;
  return fetch(API + path, { method: 'POST', headers, body: JSON.stringify(body), keepalive: !!keep })

<script>
/* =====================================================================
   NEON VOID — settings.js  (módulo de Configurações)
   ---------------------------------------------------------------------
   Como integrar: coloque UMA linha no FINAL do <body> do index.html,
   depois de todos os outros <script>:

       <script src="settings.js"> (tag script apontando para este arquivo)

   O que ele faz:
   - Aba pequena (cinza) no canto superior esquerdo, um pouco menor que
     as estrelas do menu (26px). Toque nela para abrir/fechar o painel.
   - Sliders de volume: Geral (Master), Música e Efeitos.
   - Tela Cheia / Modo Janela.
   - Tiro Automático / Manual. No Manual, aparece um botão ATIRAR no
     celular (e no PC: botão esquerdo do mouse ou tecla F). O tiro sai
     para onde a nave está olhando.
   - Salva tudo em localStorage (chave "nv_settings_v1") a cada mudança.

   Módulos internos: Store · Bus (áudio) · Screen · Fire · UI
   API pública: window.NVSettings (veja o fim do arquivo)
   ===================================================================== */
(function () {
  'use strict';
  if (window.NVSettings) return;

  /* ---------- Padrões ---------- */
  const KEY = 'nv_settings_v1';
  const DEFAULTS = { master: 1, music: 0.7, sfx: 1, fullscreen: false, fireMode: 'auto' };
  const listeners = [];
  let cfg = Object.assign({}, DEFAULTS);

  /* =================== Módulo Store (salvar/carregar) =================== */
  const Store = {
    clean(r) {
      const o = {};
      if (!r || typeof r !== 'object') return o;
      ['master', 'music', 'sfx'].forEach(k => {
        if (typeof r[k] === 'number' && isFinite(r[k])) o[k] = Math.min(1, Math.max(0, r[k]));
      });
      if (typeof r.fullscreen === 'boolean') o.fullscreen = r.fullscreen;
      if (r.fireMode === 'auto' || r.fireMode === 'manual') o.fireMode = r.fireMode;
      return o;
    },
    load() {
      try { return Object.assign({}, DEFAULTS, Store.clean(JSON.parse(localStorage.getItem(KEY)))); }
      catch (e) { return Object.assign({}, DEFAULTS); }
    },
    _t: 0,
    save() { // salva logo após a última mudança (evita gravar a cada pixel do slider)
      clearTimeout(Store._t);
      Store._t = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) {} }, 120);
    },
    saveNow() { clearTimeout(Store._t); try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) {} }
  };

  function set(k, v) {
    if (!(k in DEFAULTS)) return;
    const c = Store.clean({ [k]: v });
    if (c[k] !== undefined) cfg[k] = c[k];
    Store.save();
    listeners.forEach(fn => { try { fn(k, cfg[k], cfg); } catch (e) {} });
  }

  /* =================== Módulo Bus (volumes) =================== */
  // Cadeia: sons do jogo -> sfxBus ┐
  //                  música -> musicBus ┴-> masterBus -> alto-falante
  const Bus = {
    ctx: null, master: null, music: null, sfx: null, demo: null,
    gameAudio() { // pega o áudio criado pelo jogo (AC / master são globais do jogo)
      try { if (typeof AC !== 'undefined' && AC && typeof master !== 'undefined' && master) return { ctx: AC, node: master }; } catch (e) {}
      return null;
    },
    attach() {
      const ga = Bus.gameAudio();
      if (!ga || Bus.ctx === ga.ctx) return !!Bus.ctx;
      Bus.ctx = ga.ctx;
      Bus.master = ga.ctx.createGain(); Bus.sfx = ga.ctx.createGain(); Bus.music = ga.ctx.createGain();
      try { ga.node.disconnect(); } catch (e) {}
      ga.node.connect(Bus.sfx);          // o "master" original do jogo passa a ser só dos efeitos
      Bus.sfx.connect(Bus.master); Bus.music.connect(Bus.master); Bus.master.connect(ga.ctx.destination);
      Bus.apply(true);
      return true;
    },
    curve: v => v * v, // curva quadrática: o slider "parece" linear para o ouvido
    apply(instant) {
      if (!Bus.ctx) return;
      const t = Bus.ctx.currentTime, f = (n, v) => instant ? (n.gain.value = v) : n.gain.setTargetAtTime(v, t, 0.03);
      f(Bus.master, Bus.curve(cfg.master)); f(Bus.sfx, Bus.curve(cfg.sfx)); f(Bus.music, Bus.curve(cfg.music));
    },
    preview() { // toca um som curtinho ao soltar o slider de efeitos
      try { if (typeof initAudio === 'function') initAudio(); Bus.attach(); if (typeof SFX !== 'undefined') SFX.coin(); } catch (e) {}
    },
    /* Música de teste (o jogo ainda não tem música). Desligada por padrão.
       Chame NVSettings.startDemoMusic() para ouvir o slider de Música funcionando. */
    startDemoMusic() {
      if (Bus.demo || !Bus.attach()) return;
      const notes = [110, 131, 165, 196, 220, 196, 165, 131]; let i = 0;
      Bus.demo = setInterval(() => {
        const c = Bus.ctx, t = c.currentTime, o = c.createOscillator(), g = c.createGain();
        o.type = 'triangle'; o.frequency.value = notes[i % 8] * (((i / 8) | 0) % 2 ? 1.5 : 1); i++;
        g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.14, t + 0.05); g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
        o.connect(g); g.connect(Bus.music); o.start(t); o.stop(t + 0.5);
      }, 300);
    },
    stopDemoMusic() { clearInterval(Bus.demo); Bus.demo = null; }
  };

  /* =================== Módulo Screen (tela cheia) =================== */
  const Screen = {
    el: () => document.documentElement,
    // No app Android (WebView) a janela já é tela cheia nativa (tema do APK); a API do navegador não é usada.
    native: /\bwv\b/.test(navigator.userAgent) || !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform()),
    supported() { const d = Screen.el(); return !Screen.native && !!(d.requestFullscreen || d.webkitRequestFullscreen); },

      c.globalAlpha = .35; c.strokeStyle = col[0]; c.lineWidth = 2; c.beginPath(); c.arc(x, y, r, 0, TAU); c.stroke(); c.globalAlpha = 1;
      if (ring) rg(0, Math.PI);
      const ma = t * .6, mx = x + Math.cos(ma) * r * 2.6, my = y + Math.sin(ma) * r * .8; c.fillStyle = col[0]; c.globalAlpha = .9; c.beginPath(); c.arc(mx, my, r * .16, 0, TAU); c.fill(); c.globalAlpha = 1;
    }
    function draw(dt) {

      const tx = act ? (M.px / w - .5) * 2 : Math.sin(t * .25) * .5, ty = act ? (M.py / h - .5) * 2 : Math.cos(t * .2) * .35, k = Math.min(1, dt * 3);

        const x = q.x - mx * 55 * q.dep, y = q.y - my * 55 * q.dep, r = q.s * (1 + .1 * Math.sin(t * 2 + q.r));
        if (act) { const d = Math.hypot(M.px - x, M.py - y); if (d < 230) { c.globalAlpha = (1 - d / 230) * .4; c.strokeStyle = q.c; c.lineWidth = 1; c.beginPath(); c.moveTo(M.px, M.py); c.lineTo(x, y); c.stroke(); } }
        c.strokeStyle = q.c; c.fillStyle = q.c; poly(x, y, r, q.n, q.r); c.globalAlpha = .06; c.fill(); c.globalAlpha = .18; c.lineWidth = 5; c.stroke(); c.globalAlpha = .85; c.lineWidth = 1.4; c.stroke();
      }
      c.globalAlpha = 1;
      if ((S.nss -= dt) <= 0) { S.nss = R(2, 5); S.ss.push({ x: R(.2, 1) * w, y: R(0, .4) * h, vx: -R(500, 800), vy: R(220, 380), l: .9 }); }
      for (let i = S.ss.length - 1; i >= 0; i--) { const s = S.ss[i]; s.x += s.vx * dt; s.y += s.vy * dt; if ((s.l -= dt) <= 0) { S.ss.splice(i, 1); continue; } const g = c.createLinearGradient(s.x, s.y, s.x - s.vx * .12, s.y - s.vy * .12); g.addColorStop(0, `rgba(${th.st},${Math.min(1, s.l * 2)})`); g.addColorStop(1, `rgba(${th.st},0)`); c.strokeStyle = g; c.lineWidth = 2; c.beginPath(); c.moveTo(s.x, s.y); c.lineTo(s.x - s.vx * .12, s.y - s.vy * .12); c.stroke(); }
      if (act) {
        const g = c.createRadialGradient(M.px, M.py, 0, M.px, M.py, 170); g.addColorStop(0, rgb(th.neb[0], .28)); g.addColorStop(1, rgb(th.neb[0], 0)); c.fillStyle = g; c.fillRect(M.px - 170, M.py - 170, 340, 340);
        if (Math.hypot(M.px - S.lx, M.py - S.ly) > 6) { S.lx = M.px; S.ly = M.py; S.tr.push({ x: M.px, y: M.py, vx: R(-30, 30), vy: R(-30, 30), l: .8 }); if (S.tr.length > 60) S.tr.shift(); }
      }
      for (let i = S.tr.length - 1; i >= 0; i--) { const p = S.tr[i]; p.x += p.vx * dt; p.y += p.vy * dt; if ((p.l -= dt) <= 0) { S.tr.splice(i, 1); continue; } c.fillStyle = rgb(th.neb[i % 4], p.l); c.beginPath(); c.arc(p.x, p.y, 2 + p.l * 3, 0, TAU); c.fill(); }
      if (th.grid) { // chão em grade neon (só na tela inicial)
        const gy = h * .76, gh = h - gy, vx = w / 2 - mx * 40; c.globalCompositeOperation = 'lighter'; c.lineWidth = 1;
        const hg = c.createLinearGradient(0, gy - 30, 0, gy + 30); hg.addColorStop(0, 'rgba(255,61,139,0)'); hg.addColorStop(.5, 'rgba(255,61,139,.35)'); hg.addColorStop(1, 'rgba(255,61,139,0)'); c.globalAlpha = 1; c.fillStyle = hg; c.fillRect(0, gy - 30, w, 60);
        c.strokeStyle = th.sh[0]; for (let i = 0; i < 9; i++) { const f = ((i + t * .4) % 9) / 9, y = gy + gh * f * f; c.globalAlpha = .06 + .3 * f; c.beginPath(); c.moveTo(0, y); c.lineTo(w, y); c.stroke(); }
        c.strokeStyle = th.sh[1]; c.globalAlpha = .2; for (let i = -12; i <= 12; i++) { c.beginPath(); c.moveTo(vx + i * w * .018, gy); c.lineTo(vx + i * w * .15, h); c.stroke(); }
        c.globalAlpha = 1;
      }
      c.globalCompositeOperation = 'source-over';
      const v = c.createRadialGradient(w / 2, h / 2, Math.min(w, h) * .35, w / 2, h / 2, Math.max(w, h) * .8); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.55)'); c.fillStyle = v; c.fillRect(0, 0, w, h);
    }

  }
  const mk = () => { const cv = document.createElement('canvas'); cv.className = 'nvbg'; return cv; };
  let H = null, last = performance.now();
  addEventListener('resize', () => { if (H) H.size(); const a = document.getElementById('nvA'); if (a && a.__bg) a.__bg.size(); const tt = document.getElementById('nvTitle'); if (tt && tt.__bg) tt.__bg.size(); });
  (function loop(now) {
    requestAnimationFrame(loop); const dt = Math.min(.05, (now - last) / 1000); last = now; if (document.hidden) return;

  })(last);

})();
